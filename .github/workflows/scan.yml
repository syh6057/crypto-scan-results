name: 5-minute v16 beam scan

on:
  push:
    branches: [main]
    paths:
      - "scanner_v16.py"
      - ".github/workflows/scan.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: v16-beam-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Validate v16 syntax
        run: python -m py_compile scanner_v16.py

      - name: Run Bithumb all-KRW two-track beam scanner
        run: python scanner_v16.py

      - name: Validate fresh outputs and health
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          for name in ("beam_scan_result.json", "beam_latest_summary.json"):
              p = Path(name)
              assert p.exists() and p.stat().st_size > 0, f"{name} missing"
              x = json.loads(p.read_text(encoding="utf-8"))
              assert x.get("source_version") == "v16-bithumb-beam-two-track", f"{name}: wrong version"

          x = json.loads(Path("beam_latest_summary.json").read_text(encoding="utf-8"))
          h = x.get("health") or {}
          print("health:", h)
          print("top2:", [(r.get("base"), r.get("beam_score"), (r.get("entry_plan") or {}).get("status")) for r in x.get("trade_candidates", [])])
          assert h.get("stage1_success", 0) > 0, "No Bithumb candle data"
          assert len(x.get("trade_candidates", [])) >= 2, "Need two ranked outputs"
          ts = datetime.fromisoformat(x["generated_at_utc"])
          age = (datetime.now(timezone.utc) - ts).total_seconds()
          assert age < 900, f"stale result: {age}s"
          PY

      - name: Commit refreshed v16 results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          output_dir="$(mktemp -d)"
          cp beam_scan_result.json beam_latest_summary.json "$output_dir/"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            cp "$output_dir"/*.json .
            git add beam_scan_result.json beam_latest_summary.json
            if git diff --cached --quiet; then
              echo "No v16 output changes to commit."
              exit 0
            fi
            git commit -m "Update v16 beam scan results"
            if git push origin main; then
              exit 0
            fi
            echo "Push raced with another update; retrying ($attempt/3)."
          done
          echo "Unable to publish v16 scan outputs after 3 attempts."
          exit 1
