name: 5-minute crypto scan

on:
  workflow_dispatch:

  schedule:
    - cron: "2-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: five-minute-crypto-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Run crypto scanner
        run: python scanner.py

      - name: Commit refreshed scan_result.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add scan_result.json

          if git diff --cached --quiet; then
            echo "No scan_result.json changes to commit."
          else
            git commit -m "Update 5-minute crypto scan"
            git push
          fi
