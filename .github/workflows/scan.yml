name: 5-minute crypto scan

on:
  workflow_dispatch:

  schedule:
    - cron: "2-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: five-minute-crypto-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Validate canonical policy and scanner syntax
        run: |
          python -m py_compile scanner.py
          python - <<'PY'
          import json
          from pathlib import Path
          policy = json.loads(Path("crypto_decision_policy.json").read_text(encoding="utf-8"))
          assert policy["schema_version"] == 1
          assert policy["policy_version"] == "2026-08-27.2"
          PY

      - name: Run policy-driven crypto scanner
        run: python scanner.py

      - name: Commit refreshed policy-driven results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add scan_result.json latest_summary.json recommendation_history.json snapshot_history.json

          if git diff --cached --quiet; then
            echo "No scan output changes to commit."
          else
            git commit -m "Update policy-driven crypto scan"
            git push
          fi
