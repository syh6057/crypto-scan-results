name: 5-minute crypto scan

on:
  push:
    branches: [main]
    paths:
      - "scanner.py"
      - "crypto_decision_policy.json"
      - ".github/workflows/scan.yml"
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: five-minute-crypto-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Validate canonical policy and scanner syntax
        run: |
          python -m py_compile scanner.py
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          policy = json.loads(Path("crypto_decision_policy.json").read_text(encoding="utf-8"))
          tree = ast.parse(Path("scanner.py").read_text(encoding="utf-8"))
          constants = {}
          for node in tree.body:
              if isinstance(node, ast.Assign) and len(node.targets) == 1:
                  target = node.targets[0]
                  if isinstance(target, ast.Name) and target.id in {
                      "SUPPORTED_POLICY_SCHEMA",
                      "SUPPORTED_POLICY_VERSION",
                  }:
                      constants[target.id] = ast.literal_eval(node.value)

          assert policy["schema_version"] == constants["SUPPORTED_POLICY_SCHEMA"], (
              "schema_version mismatch between policy and scanner"
          )
          assert policy["policy_version"] == constants["SUPPORTED_POLICY_VERSION"], (
              "policy_version mismatch between policy and scanner"
          )
          PY

      - name: Run policy-driven crypto scanner
        run: python scanner.py

      - name: Validate generated policy-driven results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          policy = json.loads(Path("crypto_decision_policy.json").read_text(encoding="utf-8"))
          for output_name in ("policy_scan_result.json", "policy_latest_summary.json"):
              output = json.loads(Path(output_name).read_text(encoding="utf-8"))
              assert output["schema_version"] == policy["schema_version"], (
                  f"{output_name}: schema_version mismatch"
              )
              assert output["policy_version"] == policy["policy_version"], (
                  f"{output_name}: policy_version mismatch"
              )
          PY

      - name: Commit refreshed policy-driven results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          output_dir="$(mktemp -d)"
          cp policy_scan_result.json policy_latest_summary.json policy_recommendation_history.json policy_snapshot_history.json "$output_dir/"

          for attempt in 1 2 3; do
            git fetch origin main
            git restore --staged --worktree policy_scan_result.json policy_latest_summary.json policy_recommendation_history.json policy_snapshot_history.json
            git checkout -B main origin/main
            cp "$output_dir"/*.json .
            git add policy_scan_result.json policy_latest_summary.json policy_recommendation_history.json policy_snapshot_history.json

            if git diff --cached --quiet; then
              echo "No scan output changes to commit."
              exit 0
            fi

            git commit -m "Update isolated policy-driven crypto scan"
            if git push origin main; then
              exit 0
            fi
            echo "Push raced with another update; retrying on latest main ($attempt/3)."
          done

          echo "Unable to publish scan outputs after 3 attempts."
          exit 1