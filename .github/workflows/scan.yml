name: 5-minute calibrated beam scan

on:
  push:
    branches: [main]
    paths:
      - "scanner_v16.py"
      - "scanner_v17.py"
      - "scanner_v18.py"
      - "scanner_v19.py"
      - ".github/workflows/scan.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: calibrated-beam-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Validate scanner syntax
        run: python -m py_compile scanner_v16.py scanner_v17.py scanner_v18.py scanner_v19.py

      - name: Run v19 predictive scan with intrarun persistence sample
        run: |
          # First observation: refresh market state, then apply expert persistence/flow filter.
          python scanner_v18.py
          python scanner_v19.py
          # Second observation inside the same Action lets v19 measure persistence instead of ranking one snapshot.
          sleep 75
          python scanner_v18.py
          python scanner_v19.py

      - name: Validate fresh outputs and expert-lock contract
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          required = (
              "beam_scan_result.json",
              "beam_latest_summary.json",
              "beam_top10_compact.json",
              "beam_state.json",
              "beam_first_seen.json",
              "beam_expert_summary.json",
              "expert_lock_state.json",
              "expert_prediction_history.json",
          )
          for name in required:
              p = Path(name)
              assert p.exists() and p.stat().st_size > 0, f"{name} missing"

          x = json.loads(Path("beam_expert_summary.json").read_text(encoding="utf-8"))
          assert x.get("expert_version") == "v19-expert-lock-predictive"
          h = x.get("health") or {}
          print("health:", h)
          preds = x.get("locked_predictions") or []
          print("locked_predictions:", [(r.get("base"), r.get("track"), r.get("expert_status"), r.get("expert_confidence"), r.get("pattern_similarity"), r.get("seen_streak")) for r in preds])
          assert h.get("stage1_success", 0) > 0, "No Bithumb candle data"
          assert len(preds) >= 1, "Need at least one expert-locked prediction"
          for r in preds:
              assert r.get("expert_status") in {"PREDICT_BUY", "PREDICT_WAIT"}
              assert (r.get("track") in {"PRE_IGNITION", "ACCELERATOR", "REACCELERATION_SPECIAL"})
          ts = datetime.fromisoformat(x["generated_at_utc"])
          age = (datetime.now(timezone.utc) - ts).total_seconds()
          assert age < 900, f"stale result: {age}s"
          PY

      - name: Commit refreshed v19 results and expert state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          output_dir="$(mktemp -d)"
          cp beam_scan_result.json beam_latest_summary.json beam_top10_compact.json beam_state.json beam_first_seen.json beam_expert_summary.json expert_lock_state.json expert_prediction_history.json "$output_dir/"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            cp "$output_dir"/*.json .
            git add beam_scan_result.json beam_latest_summary.json beam_top10_compact.json beam_state.json beam_first_seen.json beam_expert_summary.json expert_lock_state.json expert_prediction_history.json
            if git diff --cached --quiet; then
              echo "No v19 output changes to commit."
              exit 0
            fi
            git commit -m "Update v19 expert-locked beam predictions"
            if git push origin main; then
              exit 0
            fi
            echo "Push raced with another update; retrying ($attempt/3)."
          done
          echo "Unable to publish v19 scan outputs after 3 attempts."
          exit 1
