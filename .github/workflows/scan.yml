name: 5-minute calibrated beam scan

on:
  push:
    branches: [main]
    paths:
      - "scanner_v16.py"
      - "scanner_v17.py"
      - "scanner_v18.py"
      - ".github/workflows/scan.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: calibrated-beam-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Validate scanner syntax
        run: python -m py_compile scanner_v16.py scanner_v17.py scanner_v18.py

      - name: Run v18 early-beam scan with intrarun micro-sample
        run: |
          # First full snapshot establishes a fresh local state even when GitHub's scheduler arrives late.
          python scanner_v18.py
          # A second snapshot inside the same Action reduces dependence on scheduler jitter.
          sleep 75
          python scanner_v18.py

      - name: Validate fresh outputs and hard-gate contract
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          required = (
              "beam_scan_result.json",
              "beam_latest_summary.json",
              "beam_top10_compact.json",
              "beam_state.json",
              "beam_first_seen.json",
          )
          for name in required:
              p = Path(name)
              assert p.exists() and p.stat().st_size > 0, f"{name} missing"

          x = json.loads(Path("beam_latest_summary.json").read_text(encoding="utf-8"))
          assert x.get("source_version") == "v18-hard-gated-first-detection"
          h = x.get("health") or {}
          print("health:", h)
          print("hard_gate_policy:", x.get("hard_gate_policy"))
          top2 = x.get("trade_candidates") or []
          print("top2:", [(r.get("base"), r.get("track"), r.get("change_24h_pct"), r.get("beam_score"), r.get("status")) for r in top2])
          assert h.get("stage1_success", 0) > 0, "No Bithumb candle data"
          assert len(top2) >= 2, "Need two hard-gated beam-ranked outputs"
          for r in top2:
              chg = float(r.get("change_24h_pct") or 0)
              track = r.get("track")
              if track == "PRE_IGNITION":
                  assert 0 <= chg < 8, (r.get("base"), track, chg)
              elif track == "ACCELERATOR":
                  assert 8 <= chg <= 20, (r.get("base"), track, chg)
              else:
                  assert track == "REACCELERATION_SPECIAL", (r.get("base"), track, chg)
          ts = datetime.fromisoformat(x["generated_at_utc"])
          age = (datetime.now(timezone.utc) - ts).total_seconds()
          assert age < 900, f"stale result: {age}s"
          PY

      - name: Commit refreshed v18 results and tracking state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          output_dir="$(mktemp -d)"
          cp beam_scan_result.json beam_latest_summary.json beam_top10_compact.json beam_state.json beam_first_seen.json "$output_dir/"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            cp "$output_dir"/*.json .
            git add beam_scan_result.json beam_latest_summary.json beam_top10_compact.json beam_state.json beam_first_seen.json
            if git diff --cached --quiet; then
              echo "No v18 output changes to commit."
              exit 0
            fi
            git commit -m "Update v18 hard-gated beam scan results"
            if git push origin main; then
              exit 0
            fi
            echo "Push raced with another update; retrying ($attempt/3)."
          done
          echo "Unable to publish v18 scan outputs after 3 attempts."
          exit 1
