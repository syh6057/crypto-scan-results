name: 5-minute calibrated beam scan

on:
  push:
    branches: [main]
    paths:
      - "scanner_v16.py"
      - "scanner_v17.py"
      - "scanner_v18.py"
      - "scanner_v19.py"
      - "scanner_v20.py"
      - "scanner_v21.py"
      - "scanner_v22.py"
      - "scanner_v23.py"
      - "scanner_v24.py"
      - "scanner_v25.py"
      - ".github/workflows/scan.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: calibrated-beam-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Validate scanner syntax
        run: python -m py_compile scanner_v16.py scanner_v17.py scanner_v18.py scanner_v19.py scanner_v20.py scanner_v21.py scanner_v22.py scanner_v23.py scanner_v24.py scanner_v25.py

      - name: Run recall scan stable one-pick and A-plus precision gate
        run: |
          python scanner_v21.py
          python scanner_v24.py
          python scanner_v19.py
          python scanner_v20.py
          python scanner_v22.py
          python scanner_v23.py
          python scanner_v25.py
          sleep 75
          python scanner_v21.py
          python scanner_v24.py
          python scanner_v19.py
          python scanner_v20.py
          python scanner_v22.py
          python scanner_v23.py
          python scanner_v25.py

      - name: Validate fresh outputs recall and A-plus contract
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          required = (
              "beam_scan_result.json",
              "beam_latest_summary.json",
              "beam_top10_compact.json",
              "beam_state.json",
              "beam_first_seen.json",
              "beam_expert_summary.json",
              "expert_lock_state.json",
              "expert_prediction_history.json",
              "beam_one_pick_summary.json",
              "one_pick_state.json",
              "one_pick_history.json",
              "beam_miss_audit.json",
              "beam_winner_recall.json",
              "winner_recall_state.json",
              "beam_a_plus_precision.json",
              "a_plus_precision_state.json",
          )
          for name in required:
              p = Path(name)
              assert p.exists() and p.stat().st_size > 0, f"{name} missing"

          scan = json.loads(Path("beam_scan_result.json").read_text(encoding="utf-8"))
          patch = ((scan.get("logic") or {}).get("miss_recovery_patch") or {})
          assert patch.get("version") == "v21-miss-recovery-source", "v21 recall patch missing"
          first_seen_patch = ((scan.get("logic") or {}).get("first_seen_recall_patch") or {})
          assert first_seen_patch.get("version") == "v24-raw-stage2-first-seen", "v24 raw-stage2 first-seen patch missing"
          assert (scan.get("health") or {}).get("stage1_requested", 0) > 0
          assert (scan.get("health") or {}).get("stage2_success", 0) > 0

          first_seen = json.loads(Path("beam_first_seen.json").read_text(encoding="utf-8"))
          stage2_bases = {r.get("base") for r in (scan.get("stage2_ranked") or []) if r.get("base") and float(r.get("price_krw") or 0) > 0}
          missing_first_seen = sorted(base for base in stage2_bases if base not in first_seen)
          assert not missing_first_seen, f"raw stage2 first-seen missing: {missing_first_seen[:10]}"

          expert = json.loads(Path("beam_expert_summary.json").read_text(encoding="utf-8"))
          assert expert.get("expert_version") == "v19-expert-lock-predictive"

          x = json.loads(Path("beam_one_pick_summary.json").read_text(encoding="utf-8"))
          assert x.get("one_pick_version") == "v20-one-pick-30-hysteresis"
          h = x.get("health") or {}
          assert h.get("stage1_success", 0) > 0, "No Bithumb candle data"
          assert x.get("status") in {"DESIGNATED", "PROVISIONAL", "NO_PICK"}
          pick = x.get("one_pick")
          if pick:
              assert pick.get("hard_invalidation_krw") is not None
              assert pick.get("target_30_krw") is not None

          audit = json.loads(Path("beam_miss_audit.json").read_text(encoding="utf-8"))
          assert audit.get("version") == "v22-miss-audit-profit-feedback"

          recall = json.loads(Path("beam_winner_recall.json").read_text(encoding="utf-8"))
          assert recall.get("version") == "v23-realized-winner-recall"
          assert (recall.get("policy") or {}).get("not_a_guarantee") is True

          aplus = json.loads(Path("beam_a_plus_precision.json").read_text(encoding="utf-8"))
          assert aplus.get("version") == "v25-a-plus-precision-30"
          assert aplus.get("status") in {"A_PLUS_BUY", "NO_BUY"}
          cal = aplus.get("prospective_calibration") or {}
          assert "may_claim_80pct_probability" in cal
          label = (aplus.get("probability_label_policy") or {}).get("current_label")
          if label == "CALIBRATED_80_PLUS":
              assert cal.get("resolved", 0) >= 50
              assert (cal.get("hit_rate") or 0) >= 0.80
          if aplus.get("a_plus_pick"):
              ap = aplus["a_plus_pick"]
              assert ap.get("a_plus_ready") is True
              assert (ap.get("entry_plan") or {}).get("target_30_krw") is not None

          ts = datetime.fromisoformat(x["generated_at_utc"])
          age = (datetime.now(timezone.utc) - ts).total_seconds()
          assert age < 900, f"stale result: {age}s"

          print("health:", h)
          print("one_pick:", (x.get("one_pick") or {}).get("base"))
          print("recall_pick:", (recall.get("confirmed_recall_pick") or {}).get("base"))
          print("a_plus_status:", aplus.get("status"))
          print("a_plus_pick:", (aplus.get("a_plus_pick") or {}).get("base"))
          print("a_plus_calibration:", cal)
          print("proxy_backtest:", aplus.get("historical_proxy_backtest"))
          PY

      - name: Commit refreshed recall one-pick and A-plus results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          output_dir="$(mktemp -d)"
          cp beam_scan_result.json beam_latest_summary.json beam_top10_compact.json beam_state.json beam_first_seen.json beam_expert_summary.json expert_lock_state.json expert_prediction_history.json beam_one_pick_summary.json one_pick_state.json one_pick_history.json beam_miss_audit.json beam_winner_recall.json winner_recall_state.json beam_a_plus_precision.json a_plus_precision_state.json "$output_dir/"
          for attempt in 1 2 3; do
            git reset --hard HEAD
            git clean -fd
            git fetch origin main
            git checkout -B main origin/main
            cp "$output_dir"/*.json .
            git add beam_scan_result.json beam_latest_summary.json beam_top10_compact.json beam_state.json beam_first_seen.json beam_expert_summary.json expert_lock_state.json expert_prediction_history.json beam_one_pick_summary.json one_pick_state.json one_pick_history.json beam_miss_audit.json beam_winner_recall.json winner_recall_state.json beam_a_plus_precision.json a_plus_precision_state.json
            if git diff --cached --quiet; then
              echo "No output changes to commit."
              exit 0
            fi
            git commit -m "Update recall one-pick and A-plus precision results"
            if git push origin main; then
              exit 0
            fi
            echo "Push raced with another update; retrying ($attempt/3)."
          done
          echo "Unable to publish scan outputs after 3 attempts."
          exit 1
