name: 30-minute calibrated beam batch scan
# manual rerun trigger: 2026-09-14 00:29 KST

on:
  push:
    branches: [main]
    paths:
      - "scanner_v*.py"
      - ".github/workflows/scan.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: calibrated-beam-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Validate scanner syntax
        run: |
          python -m py_compile \
            scanner_v19.py scanner_v20.py scanner_v21.py scanner_v22.py \
            scanner_v23.py scanner_v24.py scanner_v25.py scanner_v26.py \
            scanner_v27.py scanner_v28.py scanner_v29.py scanner_v30.py \
            scanner_v31.py scanner_v32.py

      - name: Run full scan and independent delivery layer
        run: |
          python scanner_v21.py
          python scanner_v24.py
          python scanner_v19.py
          python scanner_v20.py
          python scanner_v22.py
          python scanner_v23.py
          python scanner_v25.py
          python scanner_v26.py
          python scanner_v27.py
          python scanner_v29.py
          python scanner_v30.py
          python scanner_v31.py
          python scanner_v32.py

      - name: Validate fresh outputs and no-silent-drop contract
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          required = (
              "beam_scan_result.json",
              "beam_latest_summary.json",
              "beam_top10_compact.json",
              "beam_state.json",
              "beam_first_seen.json",
              "beam_expert_summary.json",
              "expert_lock_state.json",
              "expert_prediction_history.json",
              "beam_one_pick_summary.json",
              "one_pick_state.json",
              "one_pick_history.json",
              "beam_miss_audit.json",
              "beam_winner_recall.json",
              "winner_recall_state.json",
              "beam_a_plus_precision.json",
              "a_plus_precision_state.json",
              "beam_a_plus_validation.json",
              "beam_final_trade_gate.json",
              "beam_30m_expert.json",
              "beam_30m_expert_history.json",
              "beam_early_strong.json",
              "early_strong_state.json",
              "early_strong_history.json",
              "beam_breakout_bridge.json",
              "breakout_bridge_state.json",
              "breakout_bridge_history.json",
              "beam_delivery_alert.json",
              "delivery_alert_state.json",
              "delivery_alert_history.json",
          )
          for name in required:
              p = Path(name)
              assert p.exists() and p.stat().st_size > 0, f"{name} missing"

          scan = json.loads(Path("beam_scan_result.json").read_text(encoding="utf-8"))
          assert (scan.get("health") or {}).get("stage1_requested", 0) > 0
          assert (scan.get("health") or {}).get("stage2_success", 0) > 0
          first_seen_patch = ((scan.get("logic") or {}).get("first_seen_recall_patch") or {})
          assert first_seen_patch.get("version") == "v24.1-episode-aware-first-seen"
          assert first_seen_patch.get("episode_gap_minutes") == 60

          final_gate = json.loads(Path("beam_final_trade_gate.json").read_text(encoding="utf-8"))
          assert final_gate.get("status") in {"FINAL_BUY", "NO_BUY"}

          bridge = json.loads(Path("beam_breakout_bridge.json").read_text(encoding="utf-8"))
          assert bridge.get("version") == "v31.1-episode-aware-early-winner-bridge"
          assert bridge.get("status") in {"BLOCKED", "EARLY_WINNER_CANDIDATE", "WATCH_ONLY", "NO_SIGNAL"}

          delivery = json.loads(Path("beam_delivery_alert.json").read_text(encoding="utf-8"))
          assert delivery.get("version") == "v32-independent-early-alert-delivery"
          contract = delivery.get("delivery_contract") or {}
          assert contract.get("independent_of_final_buy_gate") is True
          assert contract.get("must_surface_bridge_promoted_top3") is True
          assert contract.get("no_silent_drop_when_final_gate_no_buy") is True
          regression = delivery.get("regression_checks") or {}
          assert regression.get("bridge_promoted_all_delivered") is True

          promoted = {x.get("base") for x in (bridge.get("promoted_top3") or []) if x.get("base")}
          delivered = {x.get("base") for x in (delivery.get("alerts") or []) if x.get("base")}
          assert promoted.issubset(delivered), f"promoted candidate silently dropped: {sorted(promoted - delivered)}"
          if promoted:
              assert delivery.get("delivery_required") is True
              assert delivery.get("primary_alert")

          ts = datetime.fromisoformat(delivery["generated_at_utc"])
          age = (datetime.now(timezone.utc) - ts).total_seconds()
          assert age < 900, f"stale delivery result: {age}s"

          print("scan_health:", scan.get("health"))
          print("final_gate:", final_gate.get("status"))
          print("bridge_promoted:", sorted(promoted))
          print("delivery_status:", delivery.get("status"))
          print("delivery_alerts:", [x.get("base") for x in delivery.get("alerts") or []])
          print("delivery_new:", [x.get("base") for x in delivery.get("new_alerts") or []])
          PY

      - name: Commit refreshed scan and delivery outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          output_dir="$(mktemp -d)"
          cp \
            beam_scan_result.json beam_latest_summary.json beam_top10_compact.json \
            beam_state.json beam_first_seen.json beam_expert_summary.json \
            expert_lock_state.json expert_prediction_history.json \
            beam_one_pick_summary.json one_pick_state.json one_pick_history.json \
            beam_miss_audit.json beam_winner_recall.json winner_recall_state.json \
            beam_a_plus_precision.json a_plus_precision_state.json beam_a_plus_validation.json \
            beam_final_trade_gate.json beam_30m_expert.json beam_30m_expert_history.json \
            beam_early_strong.json early_strong_state.json early_strong_history.json \
            beam_breakout_bridge.json breakout_bridge_state.json breakout_bridge_history.json \
            beam_delivery_alert.json delivery_alert_state.json delivery_alert_history.json \
            "$output_dir/"

          for attempt in 1 2 3; do
            git reset --hard HEAD
            git clean -fd
            git fetch origin main
            git checkout -B main origin/main
            cp "$output_dir"/*.json .
            git add \
              beam_scan_result.json beam_latest_summary.json beam_top10_compact.json \
              beam_state.json beam_first_seen.json beam_expert_summary.json \
              expert_lock_state.json expert_prediction_history.json \
              beam_one_pick_summary.json one_pick_state.json one_pick_history.json \
              beam_miss_audit.json beam_winner_recall.json winner_recall_state.json \
              beam_a_plus_precision.json a_plus_precision_state.json beam_a_plus_validation.json \
              beam_final_trade_gate.json beam_30m_expert.json beam_30m_expert_history.json \
              beam_early_strong.json early_strong_state.json early_strong_history.json \
              beam_breakout_bridge.json breakout_bridge_state.json breakout_bridge_history.json \
              beam_delivery_alert.json delivery_alert_state.json delivery_alert_history.json
            if git diff --cached --quiet; then
              echo "No output changes to commit."
              exit 0
            fi
            git commit -m "Update 30-minute scan and early-alert delivery results"
            if git push origin main; then
              exit 0
            fi
            echo "Push raced with another update; retrying ($attempt/3)."
          done
          echo "Unable to publish scan outputs after 3 attempts."
          exit 1
